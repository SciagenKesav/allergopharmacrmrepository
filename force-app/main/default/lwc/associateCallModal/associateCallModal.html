<template>
    <section class="modal-backdrop" onclick={handleClose}>
        <div class="modal-panel" onclick={stopPropagation}>
            <div class="modal-header">
                <h3>Associate a Call</h3>
                <p class="modal-subtitle">Link an existing Planned Call or Call Visit Report to {planLabel}</p>
                <button class="close-button" title="Close" onclick={handleClose}>&times;</button>
            </div>

            <div class="modal-body">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                </template>
                <template if:false={isLoading}>
                    <template if:true={hasOptions}>
                        <ul class="call-list">
                            <template for:each={rows} for:item="row">
                                <li key={row.key}>
                                    <div class="call-info">
                                        <span class="call-kind">{row.kind}</span>
                                        <span class="call-name">{row.label}</span>
                                        <span class="call-sub">{row.subLabel}</span>
                                    </div>
                                    <lightning-button
                                        label="Link"
                                        variant="brand"
                                        disabled={row.isLinking}
                                        data-id={row.id}
                                        data-kind={row.kind}
                                        onclick={handleLink}
                                    ></lightning-button>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template if:false={hasOptions}>
                        <p class="empty-text">No unlinked calls found for this account.</p>
                    </template>
                </template>
            </div>

            <div class="modal-footer">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
            </div>
        </div>
    </section>
</template>
