<template>
    <div class="browser">
        <div class="filter-pane">
            <div class="pane-header">
                <c-sciagen-logo size="small"></c-sciagen-logo>
                <h2>Accounts</h2>
                <lightning-button
                    class="new-button"
                    variant="brand"
                    label={newButtonLabel}
                    icon-name="utility:add"
                    onclick={handleOpenCreate}
                ></lightning-button>
            </div>

            <div class="my-territory-row" title="The territory(ies) you belong to">
                <lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>
                <span>{myTerritoryLabel}</span>
            </div>

            <div class="saved-view-row">
                <lightning-combobox
                    label="Saved View"
                    variant="label-hidden"
                    value={activeViewId}
                    options={savedViewOptions}
                    onchange={handleApplySavedView}
                ></lightning-combobox>
                <lightning-button-icon icon-name="utility:save" alternative-text="Save view" title="Save view" onclick={handleOpenSaveView}></lightning-button-icon>
                <template if:true={hasActiveView}>
                    <lightning-button-icon icon-name="utility:delete" alternative-text="Delete view" title="Delete view" onclick={handleDeleteCurrentView}></lightning-button-icon>
                </template>
            </div>

            <lightning-input
                type="search"
                label="Search Accounts"
                variant="label-hidden"
                placeholder="Search by name or specialty..."
                value={searchTerm}
                onchange={handleSearchChange}
            ></lightning-input>

            <lightning-button-group class="type-toggle-row">
                <lightning-button label="All" variant={typeToggleAllVariant} onclick={handleTypeToggleAll}></lightning-button>
                <lightning-button label="HCPs" variant={typeToggleHcpVariant} onclick={handleTypeToggleHcp}></lightning-button>
                <lightning-button label="HCOs" variant={typeToggleHcoVariant} onclick={handleTypeToggleHco}></lightning-button>
            </lightning-button-group>

            <div class="filter-row">
                <lightning-combobox
                    label="Territory"
                    variant="label-hidden"
                    value={territoryFilter}
                    options={territoryOptions}
                    onchange={handleTerritoryFilterChange}
                ></lightning-combobox>
                <lightning-combobox
                    label="Segmentation"
                    variant="label-hidden"
                    value={segmentationFilter}
                    options={segmentationOptions}
                    onchange={handleSegmentationFilterChange}
                ></lightning-combobox>
            </div>

            <div class="filter-row">
                <lightning-combobox
                    label="Specialty"
                    variant="label-hidden"
                    value={specialtyFilter}
                    options={specialtyOptions}
                    onchange={handleSpecialtyFilterChange}
                ></lightning-combobox>
                <lightning-combobox
                    label="HCO Type"
                    variant="label-hidden"
                    value={hcoTypeFilter}
                    options={hcoTypeOptions}
                    onchange={handleHcoTypeFilterChange}
                ></lightning-combobox>
            </div>

            <lightning-input
                type="text"
                label="City"
                variant="label-hidden"
                placeholder="Filter by city..."
                value={cityFilter}
                onchange={handleCityFilterChange}
            ></lightning-input>

            <lightning-combobox
                label="Custom List"
                variant="label-hidden"
                value={customListFilter}
                options={customListFilterOptions}
                onchange={handleCustomListFilterChange}
            ></lightning-combobox>

            <div class="sort-row">
                <lightning-combobox
                    label="Sort by"
                    variant="label-hidden"
                    value={sortField}
                    options={sortFieldOptions}
                    onchange={handleSortFieldChange}
                ></lightning-combobox>
                <lightning-button-icon icon-name={sortIcon} alternative-text="Toggle sort direction" title="Toggle sort direction" onclick={handleToggleSortDirection}></lightning-button-icon>
            </div>

            <div class="quick-filter-row">
                <lightning-button
                    label="KOL"
                    icon-name="utility:favorite"
                    variant={kolButtonVariant}
                    onclick={handleToggleKolOnly}
                ></lightning-button>
                <lightning-button
                    label="Emerging Expert"
                    icon-name="utility:trending"
                    variant={emergingButtonVariant}
                    onclick={handleToggleEmergingOnly}
                ></lightning-button>
            </div>

            <div class="counter-row">
                <div class="counter-tile">
                    <span class="counter-value">{results.length}</span>
                    <span class="counter-label">In View</span>
                </div>
                <div class="counter-tile">
                    <span class="counter-value">{kolCount}</span>
                    <span class="counter-label">KOLs</span>
                </div>
                <div class="counter-tile">
                    <span class="counter-value">{emergingCount}</span>
                    <span class="counter-label">Emerging</span>
                </div>
            </div>

            <div class="toolbar-row">
                <lightning-button label={selectionButtonLabel} onclick={handleToggleSelectionMode}></lightning-button>
                <template if:true={selectionOn}>
                    <span class="selected-count">{selectedCount} selected</span>
                    <lightning-button
                        label="Add to List"
                        variant="brand"
                        disabled={hasNoSelectedRows}
                        onclick={handleOpenAddToList}
                    ></lightning-button>
                </template>
            </div>

            <template if:true={error}>
                <div class="error">{error}</div>
            </template>
        </div>

        <div class="main-pane">
            <!-- View switcher + "Add Column" sit at the top of the results (like a standard list view's
                 view controls). Add Column lists every field; a tick = currently displayed, in list and
                 table view alike. -->
            <div class="results-toolbar">
                <div class="view-mode-toggle">
                    <lightning-button-icon
                        icon-name="utility:list"
                        alternative-text="List view"
                        title="List view"
                        variant={listViewIconVariant}
                        onclick={handleShowListView}
                    ></lightning-button-icon>
                    <lightning-button-icon
                        icon-name="utility:table"
                        alternative-text="Table view"
                        title="Table view"
                        variant={tableViewIconVariant}
                        onclick={handleShowTableView}
                    ></lightning-button-icon>
                    <lightning-button-icon
                        icon-name="utility:location"
                        alternative-text="Map view"
                        title="Map view"
                        variant={mapViewIconVariant}
                        onclick={handleShowMapView}
                    ></lightning-button-icon>
                </div>
                <div class="add-column">
                    <button type="button" class="add-column-button" aria-haspopup="true" aria-expanded={isColumnMenuOpen} onclick={handleToggleColumnMenu}>
                        <span>Add Column</span>
                        <lightning-icon icon-name="utility:down" size="xx-small" class="add-column-caret"></lightning-icon>
                    </button>
                    <template if:true={isColumnMenuOpen}>
                        <div class="column-menu-backdrop" onclick={handleCloseColumnMenu}></div>
                        <div class="column-menu" role="menu">
                            <div class="column-menu-head">
                                <span>Fields to display ({visibleColumnCount})</span>
                                <button type="button" class="column-reset" onclick={handleResetColumns}>Reset</button>
                            </div>
                            <ul class="column-menu-list">
                                <template for:each={columnOptions} for:item="col">
                                    <li key={col.key} class={col.rowClass} role="menuitemcheckbox" aria-checked={col.isSelected} data-key={col.key} onclick={handleToggleColumn}>
                                        <span class="column-check">
                                            <template if:true={col.isSelected}>
                                                <lightning-icon icon-name="utility:check" size="x-small"></lightning-icon>
                                            </template>
                                        </span>
                                        <span class="column-label">{col.label}</span>
                                        <template if:true={col.isLocked}>
                                            <span class="column-note">always shown</span>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>

            <template if:true={isMapView}>
                <template if:true={hasMapMarkers}>
                    <lightning-map
                        map-markers={mapMarkers}
                        selected-marker-value={selectedId}
                        onmarkerselect={handleMarkerSelect}
                        list-view="hidden"
                    ></lightning-map>
                </template>
                <template if:false={hasMapMarkers}>
                    <div class="empty-detail">No accounts in the current view have a location (coordinates or city) to plot.</div>
                </template>
            </template>

            <template if:true={isListView}>
                <template if:true={isSearching}>
                    <lightning-spinner alternative-text="Searching" size="small"></lightning-spinner>
                </template>

                <template if:false={isSearching}>
                    <template if:true={hasResults}>
                        <div class="main-list-row">
                            <ul class="result-list">
                                <template for:each={rows} for:item="row">
                                    <li key={row.id} class={row.rowClass} data-id={row.id} onclick={handleSelect}>
                                        <template if:true={selectionOn}>
                                            <input type="checkbox" class="row-checkbox" data-id={row.id} checked={row.checked} onclick={handleRowCheckboxChange} onchange={handleRowCheckboxChange} />
                                        </template>
                                        <div class="result-avatar">
                                            <lightning-icon icon-name={row.iconName} size="small" title={row.type}></lightning-icon>
                                        </div>
                                        <div class="result-body">
                                            <div class="result-top">
                                                <template if:true={row.showType}>
                                                    <span class="pill" style={row.typeStyle}>{row.type}</span>
                                                </template>
                                                <div class="result-name">{row.name}</div>
                                                <template if:true={row.showKol}>
                                                    <lightning-icon icon-name="utility:favorite" size="xx-small" title="KOL"></lightning-icon>
                                                </template>
                                                <template if:true={row.showEmerging}>
                                                    <lightning-icon icon-name="utility:trending" size="xx-small" title="Emerging Expert"></lightning-icon>
                                                </template>
                                            </div>
                                            <template if:true={row.showSubtitle}>
                                                <div class="result-meta">{row.subtitle}<template if:true={row.showCity}> &middot; {row.city}</template></div>
                                            </template>
                                            <template if:false={row.showSubtitle}>
                                                <template if:true={row.showCity}>
                                                    <div class="result-meta">{row.city}</div>
                                                </template>
                                            </template>
                                            <template for:each={row.extraFields} for:item="f">
                                                <div key={f.key} class="result-extra"><span class="result-extra-label">{f.label}:</span> {f.value}</div>
                                            </template>
                                            <template if:true={row.showTerritory}>
                                                <div class="result-territory">{row.territory}</div>
                                            </template>
                                        </div>
                                        <lightning-icon class="drill-icon" icon-name="utility:chevronright" size="xx-small"></lightning-icon>
                                    </li>
                                </template>
                            </ul>

                            <template if:true={isNameSort}>
                                <nav class="alpha-rail">
                                    <template for:each={alphabetKeys} for:item="a">
                                        <button key={a.key} class={a.navClass} data-letter={a.letter} disabled={a.disabled} onclick={handleAlphaJump}>{a.letter}</button>
                                    </template>
                                </nav>
                            </template>
                        </div>

                        <div class="pagination-row">
                            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous page" disabled={cannotGoPrevPage} onclick={handlePrevPage}></lightning-button-icon>
                            <span class="page-label">{pageLabel}</span>
                            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Next page" disabled={cannotGoNextPage} onclick={handleNextPage}></lightning-button-icon>
                            <lightning-combobox class="page-size" name="pageSize" label="Records per page" variant="label-hidden" dropdown-alignment="bottom-left" value={pageSizeValue} options={pageSizeOptions} onchange={handlePageSizeChange}></lightning-combobox>
                        </div>
                    </template>
                    <template if:false={hasResults}>
                        <div class="empty">No accounts found.</div>
                    </template>
                </template>
            </template>

            <template if:true={isTableView}>
                <template if:true={isSearching}>
                    <lightning-spinner alternative-text="Searching" size="small"></lightning-spinner>
                </template>
                <template if:false={isSearching}>
                    <template if:true={hasResults}>
                        <div class="table-wrap">
                          <div class="table-inner" style={tableInnerStyle}>
                            <lightning-datatable
                                key-field="id"
                                data={tableRows}
                                columns={tableColumns}
                                sorted-by={tableSortedBy}
                                sorted-direction={tableSortedDirection}
                                onsort={handleTableSort}
                                onrowaction={handleTableRowAction}
                                hide-checkbox-column
                            ></lightning-datatable>
                          </div>
                        </div>
                        <div class="pagination-row">
                            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous page" disabled={cannotGoPrevPage} onclick={handlePrevPage}></lightning-button-icon>
                            <span class="page-label">{pageLabel}</span>
                            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Next page" disabled={cannotGoNextPage} onclick={handleNextPage}></lightning-button-icon>
                            <lightning-combobox class="page-size" name="pageSize" label="Records per page" variant="label-hidden" dropdown-alignment="bottom-left" value={pageSizeValue} options={pageSizeOptions} onchange={handlePageSizeChange}></lightning-combobox>
                        </div>
                    </template>
                    <template if:false={hasResults}>
                        <div class="empty">No accounts found.</div>
                    </template>
                </template>
            </template>
        </div>
    </div>

    <template if:true={isCreating}>
        <section class="modal-backdrop">
            <div class="modal" role="dialog" aria-modal="true" aria-label="New Account">
                <div class="modal-header">
                    <h2>New Account</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseCreate}></lightning-button-icon>
                </div>
                <div class="modal-body">
                    <lightning-combobox
                        label="Type"
                        value={newAccountType}
                        options={newAccountTypeOptions}
                        onchange={handleNewAccountTypeChange}
                        class="type-picker"
                    ></lightning-combobox>

                    <lightning-record-edit-form
                        object-api-name="Sciagen_Account__c"
                        onsuccess={handleCreateSuccess}
                        onerror={handleCreateError}
                    >
                        <lightning-input-field field-name="Type__c" value={newAccountType} class="hidden-field"></lightning-input-field>
                        <div class="edit-grid">
                            <template for:each={createFields} for:item="fieldName">
                                <lightning-input-field key={fieldName} field-name={fieldName}></lightning-input-field>
                            </template>
                        </div>
                        <div class="edit-actions">
                            <lightning-button label="Cancel" onclick={handleCloseCreate}></lightning-button>
                            <lightning-button variant="brand" type="submit" label="Create"></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </div>
        </section>
    </template>

    <template if:true={isRequesting}>
        <section class="modal-backdrop">
            <div class="modal" role="dialog" aria-modal="true" aria-label="New Request">
                <div class="modal-header">
                    <h2>New Request</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseRequest}></lightning-button-icon>
                </div>
                <div class="modal-body">
                    <p class="request-hint">
                        Submits a Data Change Request for review — the account is created once a steward approves it.
                    </p>
                    <lightning-combobox
                        label="Type"
                        value={requestType}
                        options={newAccountTypeOptions}
                        onchange={handleRequestTypeChange}
                        class="type-picker"
                    ></lightning-combobox>

                    <template if:true={isRequestingHCP}>
                        <lightning-record-picker
                            label="Affiliated HCO"
                            placeholder="Search hospitals, pharmacies…"
                            object-api-name="Sciagen_Account__c"
                            filter={hcoFilter}
                            onchange={handleRelatedHCOChange}
                            required
                        ></lightning-record-picker>
                    </template>

                    <div class="edit-grid">
                        <template for:each={requestFieldRows} for:item="field">
                            <template if:true={field.isPicklist}>
                                <lightning-combobox
                                    key={field.key}
                                    label={field.label}
                                    value={field.value}
                                    options={field.options}
                                    data-field={field.key}
                                    required={field.required}
                                    onchange={handleRequestFieldChange}
                                ></lightning-combobox>
                            </template>
                            <template if:true={field.isText}>
                                <lightning-input
                                    key={field.key}
                                    label={field.label}
                                    type={field.type}
                                    value={field.value}
                                    data-field={field.key}
                                    required={field.required}
                                    onchange={handleRequestFieldChange}
                                ></lightning-input>
                            </template>
                        </template>
                    </div>
                    <div class="edit-actions">
                        <lightning-button label="Cancel" onclick={handleCloseRequest}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Submit Request"
                            onclick={handleSubmitRequest}
                            disabled={submitRequestDisabled}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <template if:true={isSavingView}>
        <section class="modal-backdrop">
            <div class="modal modal-small" role="dialog" aria-modal="true" aria-label="Save View">
                <div class="modal-header">
                    <h2>Save View</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseSaveView}></lightning-button-icon>
                </div>
                <div class="modal-body">
                    <lightning-input
                        type="text"
                        label="View Name"
                        value={saveViewName}
                        onchange={handleSaveViewNameChange}
                    ></lightning-input>
                    <div class="edit-actions">
                        <lightning-button label="Cancel" onclick={handleCloseSaveView}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={handleConfirmSaveView}></lightning-button>
                    </div>
                </div>
            </div>
        </section>
    </template>

    <template if:true={isAddingToList}>
        <section class="modal-backdrop">
            <div class="modal modal-small" role="dialog" aria-modal="true" aria-label="Add to List">
                <div class="modal-header">
                    <h2>Add {selectedCount} to List</h2>
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseAddToList}></lightning-button-icon>
                </div>
                <div class="modal-body">
                    <lightning-combobox
                        label="List"
                        value={targetListId}
                        options={customListOptions}
                        onchange={handleTargetListChange}
                    ></lightning-combobox>
                    <template if:true={isCreatingNewList}>
                        <lightning-input
                            type="text"
                            label="New List Name"
                            value={newListName}
                            onchange={handleNewListNameChange}
                        ></lightning-input>
                    </template>
                    <div class="edit-actions">
                        <lightning-button label="Cancel" onclick={handleCloseAddToList}></lightning-button>
                        <lightning-button variant="brand" label="Add" onclick={handleConfirmAddToList}></lightning-button>
                    </div>
                </div>
            </div>
        </section>
    </template>
</template>
