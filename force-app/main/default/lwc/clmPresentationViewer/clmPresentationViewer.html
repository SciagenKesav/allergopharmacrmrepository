<template>
    <div class="viewer">
        <div class="viewer-toolbar">
            <lightning-button label="Back to Library" icon-name="utility:back" onclick={handleBack}></lightning-button>
            <template if:true={detail}>
                <span class="pill" style={brandStyle}>{detail.brand}</span>
                <h3>{detail.name}</h3>
            </template>
        </div>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <template if:false={hasSlides}>
                <div class="empty-state">This presentation has no slides yet.</div>
            </template>

            <template if:true={isShowingSlide}>
                <div class="slide-nav">
                    <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrevSlide} disabled={isFirstSlide}></lightning-button>
                    <span class="slide-position">{slidePositionLabel}</span>
                    <lightning-button label={nextButtonLabel} icon-name="utility:chevronright" icon-position="right" variant="brand" onclick={handleNextSlide}></lightning-button>
                </div>
                <div class="slide-card slide-card-current">
                    <div class="slide-header">
                        <span class="slide-no">Slide {currentSlide.slideNo}</span>
                        <span class="slide-name">{currentSlide.name}</span>
                        <span class="file-type-badge">{currentSlide.fileType}</span>
                        <template if:true={currentSlide.durationLabel}>
                            <span class="file-type-badge">{currentSlide.durationLabel}</span>
                        </template>
                    </div>
                    <template if:true={currentSlide.hasFile}>
                        <lightning-button
                            label="Preview File"
                            icon-name="utility:preview"
                            data-url={currentSlide.assetUrl}
                            onclick={handlePreview}
                        ></lightning-button>
                    </template>
                    <template if:true={currentSlide.isHtml}>
                        <lightning-button
                            label="Preview HTML"
                            icon-name="utility:preview"
                            data-id={currentSlide.id}
                            onclick={handleToggleHtmlPreview}
                        ></lightning-button>
                        <template if:true={currentSlide.isHtmlExpanded}>
                            <div class="html-preview">
                                <lightning-formatted-rich-text value={currentSlide.htmlContent}></lightning-formatted-rich-text>
                            </div>
                        </template>
                    </template>
                    <template if:false={currentSlide.hasFile}>
                        <template if:false={currentSlide.isHtml}>
                            <div class="no-file">No file attached to this slide.</div>
                        </template>
                    </template>
                </div>
            </template>

            <template if:true={showEndState}>
                <div class="end-state">
                    <lightning-icon icon-name="utility:check" variant="success" size="large"></lightning-icon>
                    <h4>End of Presentation</h4>
                    <p>You've reached the last slide of {detail.name}.</p>
                    <div class="end-state-actions">
                        <lightning-button label="Restart" onclick={handleRestart}></lightning-button>
                        <lightning-button label="Back to Library" variant="brand" onclick={handleBack}></lightning-button>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
