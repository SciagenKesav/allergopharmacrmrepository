<template>
    <div class="header-form">
        <div class="card-header">
            <lightning-icon icon-name="utility:call" size="x-small"></lightning-icon>
            <h3>{title}</h3>
        </div>
        <template if:false={isReadOnly}>
            <lightning-record-edit-form
                object-api-name="Call_Visit_Report__c"
                record-id={recordId}
                onsubmit={handleSubmit}
                onsuccess={handleSuccess}
                onerror={handleError}
            >
                <div class="edit-grid">
                    <template if:false={isEditing}>
                        <lightning-input-field field-name="HCP__c" value={defaultHcpId}></lightning-input-field>
                        <lightning-input-field field-name="HCO__c" value={defaultHcoId}></lightning-input-field>
                        <template if:true={showDefaultHcoAddress}>
                            <div class="detail-field detail-field-wide">
                                <span class="detail-label">Visiting At</span>
                                <span class="detail-value">{defaultHcoAddress}</span>
                            </div>
                        </template>
                    </template>
                    <template if:true={isEditing}>
                        <lightning-input-field field-name="HCP__c"></lightning-input-field>
                        <lightning-input-field field-name="HCO__c"></lightning-input-field>
                    </template>
                    <lightning-input-field field-name="Visit_Date__c"></lightning-input-field>
                    <lightning-input-field field-name="Call_Type__c"></lightning-input-field>
                    <lightning-input-field field-name="Call_Status__c"></lightning-input-field>
                    <lightning-input-field field-name="Activity_Type__c"></lightning-input-field>
                    <lightning-input-field field-name="Territory__c"></lightning-input-field>
                    <lightning-input-field field-name="Plan__c"></lightning-input-field>
                    <lightning-input-field field-name="Start_Time__c"></lightning-input-field>
                    <lightning-input-field field-name="End_Time__c"></lightning-input-field>
                    <lightning-input-field field-name="Next_Visit_Date__c"></lightning-input-field>
                </div>
                <div class="edit-grid-wide">
                    <lightning-input-field field-name="Pre_Call_Notes__c"></lightning-input-field>
                    <lightning-input-field field-name="Discussion_Summary__c"></lightning-input-field>
                    <lightning-input-field field-name="Next_Call_Notes__c"></lightning-input-field>
                </div>
                <div class="edit-actions">
                    <lightning-button label="Cancel" onclick={handleCancel} disabled={isSaving}></lightning-button>
                    <lightning-button variant="brand" type="submit" label="Save" disabled={isSaving}></lightning-button>
                </div>
            </lightning-record-edit-form>
        </template>
        <template if:true={isReadOnly}>
            <div class="locked-banner">This call report has been submitted and is locked for editing.</div>
            <lightning-record-view-form object-api-name="Call_Visit_Report__c" record-id={recordId}>
                <div class="view-grid">
                    <lightning-output-field field-name="HCP__c"></lightning-output-field>
                    <lightning-output-field field-name="HCO__c"></lightning-output-field>
                    <lightning-output-field field-name="Visit_Date__c"></lightning-output-field>
                    <lightning-output-field field-name="Call_Type__c"></lightning-output-field>
                    <lightning-output-field field-name="Territory__c"></lightning-output-field>
                    <lightning-output-field field-name="Plan__c"></lightning-output-field>
                </div>
            </lightning-record-view-form>
        </template>
    </div>
</template>
