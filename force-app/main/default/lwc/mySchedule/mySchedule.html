<template>
    <div class="schedule">
        <div class="schedule-header">
            <div class="header-left">
                <h2>{rangeLabel}</h2>
                <span class="chip chip-planned">{plannedChipLabel}</span>
                <span class="chip chip-submitted">{submittedChipLabel}</span>
            </div>
            <div class="header-right">
                <lightning-button-group>
                    <lightning-button label="‹" onclick={handlePrev}></lightning-button>
                    <lightning-button label="Today" onclick={handleToday}></lightning-button>
                    <lightning-button label="›" onclick={handleNext}></lightning-button>
                </lightning-button-group>
                <lightning-button-group>
                    <template for:each={modeButtons} for:item="m">
                        <lightning-button key={m.key} label={m.label} variant={m.variant} data-value={m.key} onclick={handleModeChange}></lightning-button>
                    </template>
                </lightning-button-group>
                <template if:false={viewingOtherUser}>
                    <lightning-button variant="brand" label="Schedule" icon-name="utility:add" onclick={handleNewVisit}></lightning-button>
                </template>
            </div>
        </div>

        <template if:true={isSelfMode}>
            <div class="kam-picker">
                <span class="my-schedule-label">My Schedule</span>
            </div>
        </template>

        <template if:true={isAdminMode}>
            <div class="kam-picker">
                <lightning-combobox
                    label="Region"
                    variant="label-hidden"
                    placeholder="Region"
                    value={selectedRegionId}
                    options={regionOptions}
                    onchange={handleRegionChange}
                ></lightning-combobox>
                <lightning-combobox
                    label="Territory"
                    variant="label-hidden"
                    placeholder="Territory"
                    value={selectedTerritoryId}
                    options={adminTerritoryOptions}
                    onchange={handleTerritoryChange}
                ></lightning-combobox>
                <lightning-combobox
                    label="Viewing"
                    variant="label-hidden"
                    value={selectedUserId}
                    options={adminKamOptions}
                    onchange={handleKamChange}
                ></lightning-combobox>
                <template if:true={viewingOtherUser}>
                    <span class="kam-picker-note">Read-only — showing this KAM's schedule</span>
                </template>
            </div>
        </template>

        <template if:true={showKamPicker}>
            <div class="kam-picker">
                <lightning-combobox
                    label="Viewing"
                    variant="label-hidden"
                    value={selectedUserId}
                    options={kamPickerOptions}
                    onchange={handleKamChange}
                ></lightning-combobox>
                <template if:true={viewingOtherUser}>
                    <span class="kam-picker-note">Read-only — showing this KAM's schedule</span>
                </template>
            </div>
        </template>

        <template if:true={showCallReport}>
            <div class="call-report-panel">
                <c-call-visit-report-detail
                    record-id={callReportRecordId}
                    default-hcp-id={callReportDefaultHcpId}
                    default-hco-id={callReportDefaultHcoId}
                    source-planned-call-id={callReportSourcePlannedCallId}
                    onclose={handleCallReportClose}
                ></c-call-visit-report-detail>
            </div>
        </template>

        <template if:false={showCallReport}>
        <c-schedule-filter-bar
            search-term={searchTerm}
            kind={kind}
            specialty={specialty}
            territory={territory}
            status={status}
            call-category={callCategory}
            category-options={categoryOptions}
            custom-list-id={customListId}
            specialty-options={specialtyOptions}
            territory-options={territoryOptions}
            custom-list-options={customListOptions}
            saved-view-options={savedViewOptions}
            onfilterchange={handleFilterChange}
        ></c-schedule-filter-bar>

        <div class="legend">
            <template for:each={legendItems} for:item="l">
                <span class="legend-item" key={l.key}><span class="legend-dot" style={l.style}></span>{l.label}</span>
            </template>
        </div>

        <div class="schedule-form-anchor"></div>
        <template if:true={showForm}>
            <c-schedule-call-form
                record-id={editingCallId}
                default-hcp-id={formDefaultHcpId}
                default-hco-id={formDefaultHcoId}
                default-date-time={formDefaultDateTime}
                onsave={handleFormSave}
                oncancel={handleFormCancel}
            ></c-schedule-call-form>
        </template>
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <template if:true={isAgendaMode}>
                <div class="agenda">
                    <template if:false={hasAgendaResults}>
                        <div class="empty-state">{agendaEmptyText}</div>
                    </template>
                    <template for:each={agendaItems} for:item="call">
                        <div class="call-card" key={call.id} style={call.cardStyle} data-id={call.id} onclick={handleRowClick}>
                            <div class="call-card-body">
                                <span class={call.nameClass}>{call.displayName}</span>
                                <span class="call-subtitle">{call.subtitle}</span>
                                <span class="call-time">{call.timeRange}</span>
                            </div>
                            <div class="call-card-side">
                                <template if:false={viewingOtherUser}>
                                    <div class="call-menu" onclick={stopClick}>
                                        <lightning-button-menu alternative-text="Actions" icon-name="utility:threedots" variant="bare" menu-alignment="right">
                                            <template if:false={call.isReportOnly}>
                                                <lightning-menu-item label="Edit" data-id={call.id} onclick={handleEditVisit}></lightning-menu-item>
                                            </template>
                                            <lightning-menu-item label={call.logVisitLabel} data-id={call.id} data-hcpid={call.hcpId} data-hcoid={call.hcoId} data-cvrid={call.resultingCVRId} onclick={handleLogVisit}></lightning-menu-item>
                                            <template if:false={call.isReportOnly}>
                                                <lightning-menu-item label="Mark Completed" data-id={call.id} onclick={handleMarkCompleted}></lightning-menu-item>
                                                <lightning-menu-item label="Mark Cancelled" data-id={call.id} onclick={handleMarkCancelled}></lightning-menu-item>
                                                <template if:false={call.isLocked}>
                                                    <template if:true={call.canDelete}>
                                                        <lightning-menu-item label="Delete" value="delete" data-id={call.id} onclick={handleDeleteVisit}></lightning-menu-item>
                                                    </template>
                                                </template>
                                            </template>
                                        </lightning-button-menu>
                                    </div>
                                </template>
                                <div class="call-pills">
                                    <span class="pill" style={call.statusStyle}>{call.stateLabel}</span>
                                    <template if:true={call.showCategory}><span class="pill" style={call.categoryStyle}>{call.callCategory}</span></template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:true={isWeekMode}>
                <c-schedule-week-grid
                    calls={filteredCalls}
                    range-start={rangeStart}
                    time-off={timeOff}
                    read-only={viewingOtherUser}
                    onscheduledrop={handleScheduleDrop}
                    onslotclick={handleSlotClick}
                    onblockaction={handleBlockAction}
                    onopencall={handleGridOpenCall}
                ></c-schedule-week-grid>
            </template>

            <template if:true={isMonthMode}>
                <c-schedule-month-grid
                    calls={filteredCalls}
                    range-start={rangeStart}
                    anchor-date={selectedDate}
                    onopencall={handleGridOpenCall}
                    onopenday={handleOpenDay}
                ></c-schedule-month-grid>
            </template>

            <template if:true={isMapMode}>
                <c-schedule-map
                    calls={filteredCalls}
                    selected-date={selectedDate}
                ></c-schedule-map>
            </template>
        </template>
        </template>
    </div>
</template>
