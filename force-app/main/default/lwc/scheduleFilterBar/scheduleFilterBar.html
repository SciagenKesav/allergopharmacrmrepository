<template>
    <div class="filter-bar">
        <lightning-input
            type="search"
            label="Search"
            variant="label-hidden"
            placeholder="Search visits by account, specialty, call type"
            value={searchTerm}
            onchange={handleSearchInput}
        ></lightning-input>
        <div class="filter-row">
            <lightning-combobox
                class="saved-view-combo"
                label="Saved View"
                variant="label-hidden"
                options={savedViewComboOptions}
                value=""
                onchange={handleSavedViewChange}
            ></lightning-combobox>
            <div class="spacer"></div>
            <lightning-button
                label={filtersButtonLabel}
                variant={filtersButtonVariant}
                icon-name="utility:filterList"
                onclick={handleToggleFilters}
            ></lightning-button>
        </div>
        <template if:true={showFilters}>
            <div class="filter-row filter-controls">
                <lightning-button-group>
                    <template for:each={kindButtons} for:item="k">
                        <lightning-button
                            key={k.key}
                            label={k.label}
                            variant={k.variant}
                            data-value={k.key}
                            onclick={handleKindChange}
                        ></lightning-button>
                    </template>
                </lightning-button-group>
                <lightning-combobox label="Specialty" variant="label-hidden" options={specialtyComboOptions} value={specialty} onchange={handleSpecialtyChange}></lightning-combobox>
                <lightning-combobox label="Territory" variant="label-hidden" options={territoryComboOptions} value={territory} onchange={handleTerritoryChange}></lightning-combobox>
                <lightning-combobox label="Status" variant="label-hidden" options={statusComboOptions} value={status} onchange={handleStatusChange}></lightning-combobox>
                <lightning-combobox label="Custom List" variant="label-hidden" options={customListComboOptions} value={customListId} onchange={handleCustomListChange}></lightning-combobox>
                <template if:true={hasActiveFilters}>
                    <lightning-button label="Clear" icon-name="utility:clear" onclick={handleClear}></lightning-button>
                </template>
            </div>
        </template>
    </div>
</template>
