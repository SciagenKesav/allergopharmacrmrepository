<template>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>

    <template if:true={error}>
        <div class="error">{error}</div>
    </template>

    <template if:true={record}>
        <div class="detail">
            <div class="detail-header">
                <div class="header-text">
                    <h2>{record.name}</h2>
                    <p class="subtitle">
                        <template if:true={isHCP}>{record.specialty} &middot; {record.hcpType}</template>
                        <template if:true={isHCO}>{record.hcoType} &middot; {record.speciality}</template>
                    </p>
                    <template if:true={hasHeaderBadges}>
                        <div class="header-badges">
                            <template for:each={headerBadges} for:item="b">
                                <span key={b.key} class="pill" style={b.style}>{b.label}</span>
                            </template>
                        </div>
                    </template>
                    <template if:true={record.territory}>
                        <span class="badge">{record.territory}</span>
                    </template>
                </div>
                <template if:false={isEditing}>
                    <div class="header-actions">
                        <lightning-button label="Call Report" icon-name="utility:call" onclick={handleAddCallReport}></lightning-button>
                        <template if:true={canEdit}>
                            <lightning-button label="Edit" onclick={handleEdit}></lightning-button>
                        </template>
                        <lightning-button label="Unassign from Territory" icon-name="utility:delete" variant="destructive-text" onclick={handleOpenUnassignConfirm}></lightning-button>
                    </div>
                </template>
            </div>

            <!-- Unassigns this Account from the running user's own territory;
                 the Account record itself is never deleted. -->
            <template if:true={isConfirmingUnassign}>
                <section class="modal-backdrop">
                    <div class="modal modal-small" role="dialog" aria-modal="true" aria-label="Unassign from Territory">
                        <div class="modal-header">
                            <h2>Unassign from Territory</h2>
                            <lightning-button-icon icon-name="utility:close" alternative-text="Close" onclick={handleCloseUnassignConfirm}></lightning-button-icon>
                        </div>
                        <div class="modal-body">
                            <p>Are you sure you want to remove this account from your territory?</p>
                            <lightning-textarea
                                label="Comment (required)"
                                placeholder="Why are you unassigning this account?"
                                value={unassignCommentInput}
                                onchange={handleUnassignCommentChange}
                            ></lightning-textarea>
                            <div class="edit-actions">
                                <lightning-button label="Cancel" onclick={handleCloseUnassignConfirm}></lightning-button>
                                <lightning-button variant="destructive" label="Remove" disabled={isUnassignConfirmDisabled} onclick={handleConfirmUnassign}></lightning-button>
                            </div>
                        </div>
                    </div>
                </section>
            </template>

            <div class="detail-body">
                <nav class="section-rail">
                    <template for:each={sections} for:item="s">
                        <button key={s.key} class={s.navClass} data-key={s.key} onclick={handleSectionSelect}>
                            <lightning-icon icon-name={s.icon} size="x-small"></lightning-icon>
                            <span>{s.label}</span>
                        </button>
                    </template>
                </nav>
                <div class="section-content">
                <!-- Edit lives inside the section-content area (not as a
                     top-level replacement of the whole page) so the section
                     rail stays visible and this still reads as the Profile
                     tab, not a disconnected separate edit page. -->
                <template if:true={isEditing}>
                    <lightning-record-edit-form
                        record-id={recordId}
                        object-api-name="Sciagen_Account__c"
                        onsubmit={handleSubmit}
                        onsuccess={handleSaveSuccess}
                        onerror={handleSaveError}
                    >
                        <!-- Grouped into sections (like the standard Salesforce Account
                             edit page's Account Information / Address Information, etc.)
                             instead of one flat, unlabeled list of every field. -->
                        <template if:true={isHCP}>
                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge">
                                        <lightning-icon icon-name="utility:identity" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Name</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="Prefix__c"></lightning-input-field>
                                    <lightning-input-field field-name="First_Name__c"></lightning-input-field>
                                    <lightning-input-field field-name="Last_Name__c"></lightning-input-field>
                                    <lightning-input-field field-name="Name"></lightning-input-field>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge icon-badge-accent">
                                        <lightning-icon icon-name="utility:education" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Professional Details</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="HCP_Type__c"></lightning-input-field>
                                    <lightning-input-field field-name="Specialty__c"></lightning-input-field>
                                    <lightning-input-field field-name="Focus_Area__c"></lightning-input-field>
                                    <lightning-input-field field-name="License_Number__c"></lightning-input-field>
                                    <lightning-input-field field-name="Licensing_Body__c"></lightning-input-field>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge icon-badge-accent">
                                        <lightning-icon icon-name="utility:location" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Address Information</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="Billing_Street__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_City__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_State__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_Postal_Code__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_Country__c"></lightning-input-field>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge icon-badge-violet">
                                        <lightning-icon icon-name="utility:phone_portrait" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Contact Information</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="Phone__c"></lightning-input-field>
                                    <lightning-input-field field-name="Email__c"></lightning-input-field>
                                    <lightning-input-field field-name="Primary_Country__c"></lightning-input-field>
                                    <lightning-input-field field-name="Account_Code__c"></lightning-input-field>
                                </div>
                            </div>
                        </template>

                        <template if:true={isHCO}>
                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge">
                                        <lightning-icon icon-name="utility:company" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Organization Details</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="Name"></lightning-input-field>
                                    <lightning-input-field field-name="HCO_Type__c"></lightning-input-field>
                                    <lightning-input-field field-name="Speciality__c"></lightning-input-field>
                                    <lightning-input-field field-name="Account_Code__c"></lightning-input-field>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge icon-badge-accent">
                                        <lightning-icon icon-name="utility:location" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Address Information</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="Billing_Street__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_City__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_State__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_Postal_Code__c"></lightning-input-field>
                                    <lightning-input-field field-name="Billing_Country__c"></lightning-input-field>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge icon-badge-violet">
                                        <lightning-icon icon-name="utility:phone_portrait" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Contact Information</h3>
                                </div>
                                <div class="edit-grid">
                                    <lightning-input-field field-name="Phone__c"></lightning-input-field>
                                    <lightning-input-field field-name="Email__c"></lightning-input-field>
                                    <lightning-input-field field-name="Website__c"></lightning-input-field>
                                </div>
                            </div>
                        </template>

                        <div class="edit-actions">
                            <lightning-button label="Cancel" onclick={handleCancelEdit} disabled={isSaving}></lightning-button>
                            <lightning-button variant="brand" type="submit" label="Save" disabled={isSaving}></lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>

                <template if:false={isEditing}>
                    <template if:true={showCallReportPanel}>
                        <div class="call-report-panel">
                            <c-call-visit-report-detail
                                default-hcp-id={callReportDefaultHcpId}
                                default-hco-id={callReportDefaultHcoId}
                                default-hco-address={callReportDefaultHcoAddress}
                                onclose={handleCloseCallReportPanel}
                            ></c-call-visit-report-detail>
                        </div>
                    </template>
                    <template if:false={showCallReportPanel}>
                    <template if:true={isProfileSection}>
                        <div class="profile-section-stack">
                            <template if:true={isHCP}>
                                <div class="card profile-summary-card">
                                    <div class="card-header">
                                        <span class="icon-badge">
                                            <lightning-icon icon-name="utility:summary" size="x-small"></lightning-icon>
                                        </span>
                                        <h3>Profile Summary</h3>
                                        <template if:true={canEdit}>
                                            <template if:false={isEditingProfileSummary}>
                                                <lightning-button label="Edit" onclick={handleEditProfileSummary}></lightning-button>
                                            </template>
                                        </template>
                                    </div>
                                    <template if:false={isEditingProfileSummary}>
                                        <div class="profile-summary-body">
                                            <div class="profile-avatar" title="Profile photo placeholder">{initials}</div>
                                            <p class="profile-summary-text">{focusAreaSummary}</p>
                                        </div>
                                    </template>
                                    <template if:true={isEditingProfileSummary}>
                                        <lightning-record-edit-form
                                            record-id={recordId}
                                            object-api-name="Sciagen_Account__c"
                                            onsubmit={handleProfileSummarySubmit}
                                            onsuccess={handleProfileSummarySaveSuccess}
                                            onerror={handleProfileSummarySaveError}
                                        >
                                            <lightning-input-field field-name="Focus_Area__c"></lightning-input-field>
                                            <div class="edit-actions">
                                                <lightning-button label="Cancel" onclick={handleCancelProfileSummaryEdit} disabled={isSavingProfileSummary}></lightning-button>
                                                <lightning-button variant="brand" type="submit" label="Save" disabled={isSavingProfileSummary}></lightning-button>
                                            </div>
                                        </lightning-record-edit-form>
                                    </template>
                                </div>
                            </template>
                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge icon-badge-accent">
                                        <lightning-icon icon-name="utility:phone_portrait" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Contact</h3>
                                </div>
                                <div class="detail-grid">
                                    <div class="detail-field">
                                        <span class="detail-label">Phone</span>
                                        <span class="detail-value">{record.phone}</span>
                                    </div>
                                    <div class="detail-field">
                                        <span class="detail-label">Email</span>
                                        <span class="detail-value">{record.email}</span>
                                    </div>
                                    <div class="detail-field">
                                        <span class="detail-label">Account Code</span>
                                        <span class="detail-value">{record.accountCode}</span>
                                    </div>
                                    <template if:true={record.territory}>
                                        <div class="detail-field">
                                            <span class="detail-label">Territory</span>
                                            <span class="detail-value">{record.territory}</span>
                                        </div>
                                    </template>
                                    <template if:true={record.website}>
                                        <div class="detail-field">
                                            <span class="detail-label">Website</span>
                                            <span class="detail-value">{record.website}</span>
                                        </div>
                                    </template>
                                    <template if:true={record.lastVisit}>
                                        <div class="detail-field">
                                            <span class="detail-label">Last Visit</span>
                                            <span class="detail-value">{record.lastVisit}</span>
                                        </div>
                                    </template>
                                    <template if:true={lastModifiedDisplay}>
                                        <div class="detail-field">
                                            <span class="detail-label">Last Modified</span>
                                            <span class="detail-value">{lastModifiedDisplay}</span>
                                        </div>
                                    </template>
                                    <template if:true={isHCP}>
                                        <div class="detail-field">
                                            <span class="detail-label">Speciality</span>
                                            <span class="detail-value">{record.specialty}</span>
                                        </div>
                                        <template if:true={record.focusArea}>
                                            <div class="detail-field">
                                                <span class="detail-label">Focus Area</span>
                                                <span class="detail-value">{record.focusArea}</span>
                                            </div>
                                        </template>
                                        <div class="detail-field">
                                            <span class="detail-label">License Number</span>
                                            <span class="detail-value">{record.licenseNumber}</span>
                                        </div>
                                        <div class="detail-field">
                                            <span class="detail-label">Licensing Body</span>
                                            <span class="detail-value">{record.licensingBody}</span>
                                        </div>
                                        <div class="detail-field">
                                            <span class="detail-label">Age</span>
                                            <span class="detail-value">{record.age}</span>
                                        </div>
                                        <div class="detail-field">
                                            <span class="detail-label">Experience</span>
                                            <span class="detail-value">{record.experienceYears}</span>
                                        </div>
                                    </template>
                                    <template if:true={isHCO}>
                                        <div class="detail-field">
                                            <span class="detail-label">HCO Type</span>
                                            <span class="detail-value">{record.hcoType}</span>
                                        </div>
                                        <div class="detail-field">
                                            <span class="detail-label">Speciality</span>
                                            <span class="detail-value">{record.speciality}</span>
                                        </div>
                                        <div class="detail-field detail-field-wide">
                                            <span class="detail-label">Address</span>
                                            <span class="detail-value">{record.billingStreet}, {record.billingCity}, {record.billingState} {record.billingPostalCode} {record.billingCountry}</span>
                                        </div>
                                        <template if:true={record.plusCode}>
                                            <div class="detail-field">
                                                <span class="detail-label">Plus Code</span>
                                                <span class="detail-value">{record.plusCode}</span>
                                            </div>
                                        </template>
                                        <template if:true={record.geolocation}>
                                            <div class="detail-field">
                                                <span class="detail-label">Geolocation</span>
                                                <span class="detail-value">{record.geolocation}</span>
                                            </div>
                                        </template>
                                        <template if:true={record.parentAccountName}>
                                            <div class="detail-field">
                                                <span class="detail-label">Parent Account</span>
                                                <span class="detail-value">{record.parentAccountName}</span>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>

                            <template if:true={isHCP}>
                                <div class="card">
                                    <div class="card-header">
                                        <span class="icon-badge">
                                            <lightning-icon icon-name="utility:education" size="x-small"></lightning-icon>
                                        </span>
                                        <h3>Qualifications</h3>
                                    </div>
                                    <template if:false={hasDegrees}>
                                        <div class="empty-tab">No degrees on file.</div>
                                    </template>
                                    <div class="detail-grid">
                                        <template for:each={degreeRows} for:item="degree">
                                            <div class="detail-field" key={degree.key}>
                                                <span class="detail-label">{degree.label}</span>
                                                <span class="detail-value">{degree.value}</span>
                                            </div>
                                        </template>
                                        <div class="detail-field">
                                            <span class="detail-label">Graduation Year</span>
                                            <span class="detail-value">{record.graduationYear}</span>
                                        </div>
                                        <div class="detail-field">
                                            <span class="detail-label">Licensing Year</span>
                                            <span class="detail-value">{record.licensingYear}</span>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template if:true={isHCP}>
                                <div class="card">
                                    <div class="card-header">
                                        <span class="icon-badge icon-badge-accent">
                                            <lightning-icon icon-name="utility:location" size="x-small"></lightning-icon>
                                        </span>
                                        <h3>Address Information</h3>
                                    </div>
                                    <div class="detail-grid">
                                        <div class="detail-field detail-field-wide">
                                            <span class="detail-label">Billing Address</span>
                                            <span class="detail-value">{record.billingStreet}, {record.billingCity}, {record.billingState} {record.billingPostalCode} {record.billingCountry}</span>
                                        </div>
                                        <template if:true={record.primaryCountry}>
                                            <div class="detail-field">
                                                <span class="detail-label">Primary Country</span>
                                                <span class="detail-value">{record.primaryCountry}</span>
                                            </div>
                                        </template>
                                        <template if:true={record.plusCode}>
                                            <div class="detail-field">
                                                <span class="detail-label">Plus Code</span>
                                                <span class="detail-value">{record.plusCode}</span>
                                            </div>
                                        </template>
                                        <template if:true={record.geolocation}>
                                            <div class="detail-field">
                                                <span class="detail-label">Geolocation</span>
                                                <span class="detail-value">{record.geolocation}</span>
                                            </div>
                                        </template>
                                        <template if:true={record.createdByName}>
                                            <div class="detail-field">
                                                <span class="detail-label">Created By</span>
                                                <span class="detail-value">{record.createdByName}</span>
                                            </div>
                                        </template>
                                        <template if:true={record.lastModifiedByName}>
                                            <div class="detail-field">
                                                <span class="detail-label">Last Modified By</span>
                                                <span class="detail-value">{record.lastModifiedByName}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:true={hasDigitalPresence}>
                                <div class="card">
                                    <div class="card-header">
                                        <span class="icon-badge icon-badge-violet">
                                            <lightning-icon icon-name="utility:world" size="x-small"></lightning-icon>
                                        </span>
                                        <h3>Digital Presence</h3>
                                    </div>
                                    <div class="detail-grid">
                                        <template if:true={record.linkedInUrl}>
                                            <div class="detail-field">
                                                <span class="detail-label">LinkedIn</span>
                                                <span class="detail-value"><a href={record.linkedInUrl} target="_blank" rel="noopener">{record.linkedInUrl}</a></span>
                                            </div>
                                        </template>
                                        <template if:true={record.twitterUrl}>
                                            <div class="detail-field">
                                                <span class="detail-label">Twitter / X</span>
                                                <span class="detail-value"><a href={record.twitterUrl} target="_blank" rel="noopener">{record.twitterUrl}</a></span>
                                            </div>
                                        </template>
                                        <template if:true={record.youtubeUrl}>
                                            <div class="detail-field">
                                                <span class="detail-label">YouTube</span>
                                                <span class="detail-value"><a href={record.youtubeUrl} target="_blank" rel="noopener">{record.youtubeUrl}</a></span>
                                            </div>
                                        </template>
                                        <template if:true={record.instagramUrl}>
                                            <div class="detail-field">
                                                <span class="detail-label">Instagram</span>
                                                <span class="detail-value"><a href={record.instagramUrl} target="_blank" rel="noopener">{record.instagramUrl}</a></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:true={hasExternalIds}>
                                <div class="card">
                                    <div class="card-header">
                                        <span class="icon-badge">
                                            <lightning-icon icon-name="utility:identity" size="x-small"></lightning-icon>
                                        </span>
                                        <h3>External IDs</h3>
                                    </div>
                                    <div class="detail-grid">
                                        <template for:each={externalIdRows} for:item="ext">
                                            <div class="detail-field" key={ext.key}>
                                                <span class="detail-label">{ext.label}</span>
                                                <span class="detail-value">{ext.value}</span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <div class="card">
                                <div class="card-header">
                                    <span class="icon-badge">
                                        <lightning-icon icon-name="utility:relate" size="x-small"></lightning-icon>
                                    </span>
                                    <h3>Affiliations</h3>
                                </div>
                                <template if:true={hasAffiliations}>
                                    <ul class="detail-list">
                                        <template for:each={affiliationRows} for:item="a">
                                            <li key={a.accountId}>
                                                <span class="pill" style={a.typeStyle}>{a.type}</span>
                                                {a.name}
                                                <template if:true={a.isPrimary}>
                                                    <span class="pill pill-primary">PRIMARY</span>
                                                </template>
                                                <span class="muted"> ({a.subtitle})</span>
                                                <span class="muted"><template if:true={a.phone}> &middot; {a.phone}</template><template if:true={a.city}> &middot; {a.city}</template></span>
                                                <template if:true={a.website}>
                                                    <div class="detail-list-sub"><a href={a.website} target="_blank" rel="noopener">{a.website}</a></div>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template if:false={hasAffiliations}>
                                    <div class="empty-tab">No affiliations on file.</div>
                                </template>
                            </div>

                            <template if:true={isHCP}>
                                <div class="card">
                                    <div class="card-header">
                                        <span class="icon-badge">
                                            <lightning-icon icon-name="utility:approval" size="x-small"></lightning-icon>
                                        </span>
                                        <h3>Multichannel Consent</h3>
                                    </div>
                                    <template if:true={hasConsent}>
                                        <div class="detail-grid">
                                            <span class="pill" style={consentEmailStyle}>{consentEmailLabel}</span>
                                            <span class="pill pill-primary">{consentChannelsLabel}</span>
                                            <template if:true={consentSignedLabel}>
                                                <span class="pill pill-primary">{consentSignedLabel}</span>
                                            </template>
                                        </div>
                                        <template if:true={consentCapturedDisplay}>
                                            <div class="detail-list-sub">Captured {consentCapturedDisplay}</div>
                                        </template>
                                    </template>
                                    <template if:false={hasConsent}>
                                        <div class="empty-tab">No consent captured yet for this HCP.</div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </template>

                    <template if:true={isTimelineSection}>
                        <div class="card">
                            <template if:true={hasTimeline}>
                                <ul class="detail-list">
                                    <template for:each={timelineRows} for:item="t">
                                        <li key={t.key}>
                                            <span class="pill" style={t.kindStyle}>{t.kind}</span>
                                            <strong>{t.title}</strong>
                                            <span class="muted"> &middot; {t.occurredAt}<template if:true={t.subtitle}> &middot; {t.subtitle}</template></span>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={hasTimeline}>
                                <div class="empty-tab">No calls or data change requests recorded yet.</div>
                            </template>
                        </div>
                    </template>

                    <template if:true={isSegmentationSection}>
                        <div class="card">
                            <div class="card-header">
                                <h3>Segmentation</h3>
                                <template if:true={isHCP}>
                                    <template if:false={isEditingSegmentation}>
                                        <lightning-button label={segmentationEditButtonLabel} onclick={handleEditSegmentation}></lightning-button>
                                    </template>

                                                        <span class="hier-node-text">
                                                            <span class="hier-node-title" title={h.name}>{h.name}</span>
                                                            <span class="hier-node-sub">{h.type}<template if:true={h.isPrimary}> · Primary</template></span>
                                                        </span>
                                                        <span class="hier-node-chevron">›</span>
                                                    </div>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                </div>
                                <template if:true={isHierarchyEmpty}>
                                    <div class="empty-tab">No parent, children, or affiliated HCPs on file.</div>
                                </template>
                            </template>
                        </div>
                    </template>

                    <template if:true={isNavigationSection}>
                        <div class="card nav-card">
                            <div class="card-header">
                                <span class="icon-badge">
                                    <lightning-icon icon-name="utility:location" size="x-small"></lightning-icon>
                                </span>
                                <h3>Navigation</h3>
                            </div>
                            <template if:true={hasLocation}>
                                <div class="nav-address">{navigationAddress}</div>
                                <lightning-map
                                    map-markers={mapMarkers}
                                    list-view="hidden"
                                    zoom-level="14"
                                    class="nav-map"
                                ></lightning-map>
                            </template>
                            <template if:false={hasLocation}>
                                <div class="empty-tab">{navigationEmptyMessage}</div>
                            </template>
                        </div>
                    </template>

                    <template if:true={isDcrSection}>
                        <div class="card">
                            <template if:true={hasDataChangeRequests}>
                                <ul class="detail-list">
                                    <template for:each={dcrRows} for:item="dcr">
                                        <li key={dcr.id}>
                                            <span class="pill" style={dcr.statusStyle}>{dcr.status}</span>
                                            <strong>{dcr.type}</strong>
                                            <span class="muted"> &middot; {dcr.submittedAt}<template if:true={dcr.submittedBy}> &middot; {dcr.submittedBy}</template></span>
                                            <template if:true={dcr.summary}>
                                                <div class="detail-list-sub">{dcr.summary}</div>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={hasDataChangeRequests}>
                                <div class="empty-tab">No data change requests on file.</div>
                            </template>
                        </div>
                    </template>
                    </template>
                </template>
                </div>
            </div>
        </div>
    </template>

    <template if:true={showCvrView}>
        <c-cvr-view-modal record-id={viewingCvrId} onclose={handleCloseCvrView}></c-cvr-view-modal>
    </template>
</template>
